name: Build seisee-test Linux portable
on:
  push:
    branches: [codex/linux-test-build-20261019]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Install Linux Qt build environment
        run: |
          apt-get update
          apt-get install -y build-essential python3-pip p7zip-full libgl1-mesa-dev curl ca-certificates file patchelf fontconfig xvfb libxkbcommon-x11-0 libxcb-cursor0 libfuse2 libxrender1 libxext6 libx11-xcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0
      - uses: actions/checkout@v4
      - name: Install matching Qt 5.15.2
        run: |
          python3 -m pip install aqtinstall==3.1.18
          python3 -m aqt install-qt linux desktop 5.15.2 gcc_64 -O /opt/Qt --archives qtbase qtsvg
          echo "/opt/Qt/5.15.2/gcc_64/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/Qt/5.15.2/gcc_64/lib" >> "$GITHUB_ENV"
      - name: Install deployment tools
        run: |
          curl -fL --retry 3 https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o /usr/local/bin/linuxdeploy
          curl -fL --retry 3 https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -o /usr/local/bin/linuxdeploy-plugin-qt
          curl -fL --retry 3 https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o /usr/local/bin/appimagetool
          chmod 755 /usr/local/bin/linuxdeploy /usr/local/bin/linuxdeploy-plugin-qt /usr/local/bin/appimagetool
      - name: Build test and package
        run: bash scripts/build-linux-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seisee-test-linux-x86_64
          path: dist/linux-test/
          if-no-files-found: warn
          retention-days: 7
